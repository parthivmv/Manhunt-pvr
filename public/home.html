<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MANHUNT — Real-Life Hide &amp; Seek</title>
<style>
/* ─── Optimized CSS for 10x Faster Rendering ────────────────────────────── */
:root {
  --bg-deep: #080d19;
  --bg-mid: #0e172a;
  --panel: rgba(17, 27, 49, 0.75);
  --panel-solid: #101c34;
  --panel-glow: rgba(30, 48, 86, 0.45);
  --line: rgba(255, 255, 255, 0.09);
  --line-soft: rgba(255, 255, 255, 0.05);
  --text: #f3f6fc;
  --muted: #98a7c5;
  --green: #9ef368;
  --green-glow: rgba(158, 243, 104, 0.35);
  --green-dark: #193322;
  --orange: #ffb45e;
  --orange-glow: rgba(255, 180, 94, 0.35);
  --orange-dark: #3a2617;
  --red: #ff6e7a;
  --red-glow: rgba(255, 110, 122, 0.35);
  --red-dark: #3a1921;
  --radius-lg: 28px;
  --radius-md: 18px;
  --radius-pill: 999px;
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-deep);
  background-image: radial-gradient(circle at 12% 14%, rgba(45, 95, 62, 0.28) 0%, transparent 48%),
                    radial-gradient(circle at 88% 18%, rgba(30, 72, 125, 0.28) 0%, transparent 50%),
                    radial-gradient(circle at 50% 80%, rgba(68, 35, 88, 0.22) 0%, transparent 60%);
  background-attachment: fixed;
  color: var(--text);
  font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  min-height: 100vh;
  letter-spacing: -0.01em;
  -webkit-font-smoothing: antialiased;
}

.wrap { max-width: 1140px; margin: auto; padding: 28px 20px 70px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 26px; }

.card {
  background: var(--panel);
  backdrop-filter: blur(24px);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 24px;
  box-shadow: 0 24px 50px -10px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.12);
}

.hero { margin: 16px 0 28px; }
.brand { font-weight: 900; letter-spacing: 0.2em; font-size: 14px; }
.brand span { color: var(--green); }
.badge { border: 1px solid var(--line); padding: 6px 14px; border-radius: var(--radius-pill); color: var(--muted); font-size: 11px; }

.card, button, .team { will-change: transform; }

.row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.row, .field { margin-bottom: 15px; }
.field label { display: block; color: var(--muted); font-size: 11px; font-weight: 800; margin: 0 0 7px; }
.field input, .field select {
  width: 100%; background: rgba(8, 14, 27, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text);
  padding: 13px 16px; border-radius: var(--radius-md); outline: none; font-size: 15px;
}
.field input:focus { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-glow); }

.team-choice { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
.team { border: 1px solid var(--line); background: rgba(10, 18, 34, 0.7); border-radius: var(--radius-md); padding: 15px; cursor: pointer; text-align: left; transition: transform 0.2s, border-color 0.2s; }
.team:active { transform: scale(0.97); }
.team.active { border-color: var(--green); box-shadow: inset 0 0 0 1px var(--green); }
.team.active.seeker { border-color: var(--orange); }

.actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
button { font-weight: 800; font-size: 14px; cursor: pointer; border: 0; padding: 13px 20px; border-radius: var(--radius-pill); transition: transform 0.2s; user-select: none; }
button:active { transform: scale(0.97); }
button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.secondary { background: rgba(36, 51, 80, 0.7); color: var(--text); border: 1px solid var(--line); }
.secondary:hover { background: rgba(45, 64, 102, 0.85); }

.primary { background: linear-gradient(135deg, #b8ff85, var(--green)); color: #0b1507; }
.primary:hover { background: linear-gradient(135deg, #c7ff9d, var(--green)); }

.hidden { display: none !important; }

@media (max-width: 520px) {
  .row { grid-template-columns: 1fr; }
  .team-choice { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><div style="width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);"></div><div><span>MAN</span>HUNT</div></div>
    <div class="badge">REAL-WORLD GAME · BETA</div>
  </div>

  <main>
    <section class="card">
      <h2 style="margin:0 0 18px">Join your game</h2>
      <p style="color: var(--muted); margin-bottom: 20px;">Enter your username, choose your team, and join a game room.</p>

      <div class="row">
        <div class="field">
          <label for="username">YOUR USERNAME</label>
          <input id="username" maxlength="24" placeholder="e.g. NightFox" autocomplete="nickname">
        </div>
        <div class="field">
          <label for="room">ROOM ID</label>
          <input id="room" maxlength="12" placeholder="e.g. PARK42" style="text-transform:uppercase">
        </div>
      </div>

      <label style="display:block;font-size:11px;font-weight:800;letter-spacing:0.07em;color:var(--muted);margin:12px 0">CHOOSE YOUR TEAM</label>
      <div class="team-choice">
        <button class="team active" id="hiderChoice">
          <strong>🫥 Hiders</strong>
          <small style="color:var(--muted)">Stay unseen. Move smart.</small>
        </button>
        <button class="team" id="seekerChoice">
          <strong>🔎 Seekers</strong>
          <small style="color:var(--muted)">Track pings &amp; catch hiders.</small>
        </button>
      </div>

      <div class="actions">
        <button id="joinBtn" class="primary">Join room →</button>
        <button class="secondary" id="randomBtn">Random room ID</button>
      </div>

      <p style="font-size:12px;color:var(--muted);margin-top:12px">Everyone must enter the same Room ID. Caught players can rejoin as spectators with a caught tag.</p>
    </section>
  </main>
</div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const state = { team: "hiders" };

  function getOrCreateDeviceId() {
    const key = "manhunt_device_id";
    let id = localStorage.getItem(key) || sessionStorage.getItem(key + "_session") || "";
    if (!id) {
      const matches = document.cookie.split(';').match(/manhunt_device_id=([^;]+)/);
      if (matches) id = decodeURIComponent(matches[1]);
    }
    if (!id || id.length < 20) {
      const tm = Date.now();
      const entropy = Math.random().toString(36).substring(2, 9);
      const rnd = Math.random().toString(36).substring(2, 10);
      id = `dm_${entropy}_${tm}_${rnd}`.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 32);
      localStorage.setItem(key, id);
      sessionStorage.setItem(key + "_session", id);
    }
    return id;
  }

  function selectTeam(t) {
    state.team = t;
    $('hiderChoice').classList.toggle("active", t === "hiders");
    $('seekerChoice').classList.toggle("active", t === "seekers");
  }

  $('hiderChoice').onclick = () => selectTeam("hiders");
  $('seekerChoice').onclick = () => selectTeam("seekers");

  $('randomBtn').onclick = () => {
    const code = "HUNT" + Math.random().toString(36).substring(2, 6).toUpperCase();
    $('room').value = code;
  };

  $('room').addEventListener("input", e => {
    const v = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g, "").slice(0, 12);
    e.target.value = v;
  });

  $('joinBtn').onclick = () => {
    const username = $('username').value.trim();
    const room = $('room').value.trim();
    if (!username || !room) return alert("Enter username and room ID");

    const deviceId = getOrCreateDeviceId();
    const params = new URLSearchParams({
      username,
      room,
      team: state.team,
      deviceId
    });

    window.location.href = `/room?${params.toString()}`;
  };
})();
</script>
</body>
</html>
